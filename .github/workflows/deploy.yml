name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # config.js는 .gitignore 처리 → Secrets에서 자동 생성
      - name: Create config.js from GitHub Secrets
        run: |
          cat > src/config.js << 'EOF'
          export const CONFIG = {
            GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}",
            DRIVE_ROOT_FOLDER_ID: "${{ secrets.DRIVE_ROOT_FOLDER_ID }}",
            SCOPES: "https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/spreadsheets email",
            CLOUD_FUNCTION_URL: "https://asia-northeast3-bwts-log-analysis.cloudfunctions.net/convert-pdf",
            ADMIN_EMAIL: "${{ secrets.ADMIN_EMAIL }}",
            SHEETS_ID: "${{ secrets.SHEETS_ID }}",
            FIREBASE: {
              apiKey: "${{ secrets.FIREBASE_API_KEY }}",
              authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
              projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
              storageBucket: "${{ secrets.FIREBASE_PROJECT_ID }}.firebasestorage.app",
              messagingSenderId: "${{ secrets.FIREBASE_SENDER_ID }}",
              appId: "${{ secrets.FIREBASE_APP_ID }}",
            },
          };
          export { INITIAL_VESSELS, STATUS_CONFIG, mapOverallStatus, CALIB_CONFIG } from "./config.static.js";
          EOF

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
